            </div>
          )}

          {espacios.length === 0 && (
            <p className="mt-6 rounded-xl border border-dashed border-black/10 px-4 py-6 text-center text-sm text-black/40">
              Todavía no se registraron espacios ni características para esta propiedad.
            </p>
          )}

          {/* Pie */}
          <div className="mt-8 border-t border-black/10 pt-4">
            <p className="text-sm font-semibold text-gray-900">Ronald Castro</p>
            <p className="text-xs text-black/50">Asesor inmobiliario · RE/MAX Expansion, San Salvador</p>
            <p className="mt-2 text-[11px] text-black/35">Información sujeta a cambios sin previo aviso. Las características pueden variar según verificación final de la propiedad.</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function DetalleCaptacionModal({ id, captaciones, contactos, contactoNombre, onClose, onToggleChecklist, onCambiarEstado, onAbrirContacto, onGuardarACM }) {
  const [error, setError] = useState("");
  const [fichaAbierta, setFichaAbierta] = useState(false);
  const [acmAbierto, setAcmAbierto] = useState(false);
  const c = captaciones.find((x) => x.id === id);
  if (!id || !c) return null;

  const hechos = c.checklist.filter((it) => it.completado).length;
  const total = c.checklist.length;

  function avanzarEstado(nuevoEstado) {
    const res = onCambiarEstado(c.id, nuevoEstado);
    setError(res.ok ? "" : res.error);
  }

  return (
    <Modal open onClose={onClose} title={`${TIPO_INMUEBLE_LABEL[c.tipoInmueble]} · ${OPERACION_INMUEBLE_LABEL[c.operacion]}`}>
      <div className="flex flex-col gap-5">
        <div>
          <p className="text-sm font-semibold text-gray-900">{c.direccion}</p>
          <p className="text-xs text-black/45">{c.zona}</p>
        </div>

        <div className="grid grid-cols-2 gap-2.5">
          <button onClick={() => setFichaAbierta(true)}
            className="flex flex-col items-center justify-center gap-1 rounded-xl bg-emerald-700 px-3 py-3 text-center text-sm font-semibold text-white hover:bg-emerald-800">
            📄 Ficha
          </button>
          <button onClick={() => setAcmAbierto(true)}
            className="flex flex-col items-center justify-center gap-1 rounded-xl bg-indigo-700 px-3 py-3 text-center text-sm font-semibold text-white hover:bg-indigo-800">
            📊 ACM
          </button>
        </div>

        <button onClick={() => { onClose(); onAbrirContacto(c.contactoId); }}
          className="flex items-center justify-between rounded-xl border border-black/10 px-3 py-2.5 text-left hover:bg-gray-50">
          <div className="flex items-center gap-2.5">
            <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-xs font-bold text-emerald-700">
              {contactoNombre(c.contactoId).charAt(0).toUpperCase()}
            </span>
            <div>
              <p className="text-sm font-semibold text-gray-900">{contactoNombre(c.contactoId)}</p>
              <p className="text-[11px] text-black/40">Propietario</p>
            </div>
          </div>
          <span className="text-xs font-medium text-emerald-700">Ver expediente →</span>
        </button>

        <div className="grid grid-cols-2 gap-3">
          <div className="rounded-xl bg-gray-100 p-3">
            <p className="text-xs text-black/45">Precio</p>
            <p className="text-sm font-semibold text-gray-900">{formatMoney(c.precio)}</p>
          </div>
          <div className="rounded-xl bg-gray-100 p-3">
            <p className="text-xs text-black/45">Comisión</p>
            <p className="text-sm font-semibold text-gray-900">{c.comisionPct}%</p>
          </div>
        </div>

        <Field label="Estado">
          <select className={inputClass} value={c.estado} onChange={(e) => avanzarEstado(e.target.value)}>
            {ESTADOS_CAPTACION.map((e) => <option key={e} value={e}>{ESTADO_CAPTACION_LABEL[e]}</option>)}
          </select>
        </Field>
        {error && <p className="text-sm text-orange-700">⚠️ {error}</p>}

        <div>
          <div className="mb-2 flex items-center justify-between">
            <h3 className="text-xs font-semibold uppercase tracking-wide text-black/40">Checklist de documentos</h3>
            <span className="text-xs font-medium text-black/45">{hechos}/{total}</span>
          </div>
          <div className="flex flex-col gap-1.5">
            {c.checklist.map((it) => (
              <label key={it.id} className="flex items-center gap-2.5 rounded-xl bg-gray-50 px-3 py-2.5 text-sm text-gray-800">
                <input type="checkbox" checked={it.completado} onChange={() => onToggleChecklist(c.id, it.id)} />
                <span className={it.completado ? "line-through text-black/40" : ""}>{it.nombre}</span>
              </label>
            ))}
          </div>
        </div>

        {c.notas && (
          <div>
            <h3 className="mb-1 text-xs font-semibold uppercase tracking-wide text-black/40">Notas</h3>
            <p className="text-sm text-gray-700">{c.notas}</p>
          </div>
        )}

        {c.espacios && c.espacios.length > 0 && (
          <div>
            <h3 className="mb-2 text-xs font-semibold uppercase tracking-wide text-black/40">Espacios y características ({c.espacios.length})</h3>
            <div className="flex flex-col gap-2.5">
              {c.espacios.map((esp) => (
                <details key={esp.id} className="rounded-xl bg-amber-50 p-3">
                  <summary className="cursor-pointer text-sm font-semibold text-amber-900">
                    {esp.icono} {esp.nombre}{esp.cantidad != null ? ` · ${esp.cantidad}` : ""}
                  </summary>
                  {esp.contadores && esp.contadores.length > 0 && (
                    <div className="mt-2 flex flex-wrap gap-1.5">
                      {esp.contadores.map((ct, i) => (
                        <Badge key={i} className="bg-amber-200 text-amber-900">{ct.nombre}: {ct.valor}</Badge>
                      ))}
                    </div>
                  )}
                  {esp.contadores && esp.contadores.some((ct) => ct.unidades && ct.unidades.length > 0) && (
                    <div className="mt-2 flex flex-col gap-1.5">
                      {esp.contadores.filter((ct) => ct.unidades).flatMap((ct) => ct.unidades).map((u, i) => (
                        <div key={i} className="rounded-lg bg-white p-2">
                          <p className="text-xs font-semibold text-amber-900">{u.etiqueta}</p>
                          {u.caracteristicas.length === 0 ? (
                            <p className="text-[11px] text-amber-800/50">Sin características registradas</p>
                          ) : (
                            <div className="mt-1 flex flex-wrap gap-1">
                              {u.caracteristicas.map((car, j) => (
                                <Badge key={j} className="bg-amber-50 text-amber-800">{car.tipo === "texto" ? `${car.nombre}: ${car.valor}` : car.nombre}</Badge>
                              ))}
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                  {esp.caracteristicas.length === 0 ? (
                    esp.contadores && esp.contadores.some((ct) => ct.unidades) ? null : (
                      <p className="mt-2 text-xs text-amber-800/60">Sin características adicionales registradas.</p>
                    )
                  ) : (
                    <div className="mt-2 flex flex-wrap gap-1.5">
                      {esp.caracteristicas.map((car, i) => (
                        <Badge key={i} className="bg-white text-amber-800">
                          {car.tipo === "texto" ? `${car.nombre}: ${car.valor}` : car.nombre}
                        </Badge>
                      ))}
                    </div>
                  )}
                </details>
              ))}
            </div>
          </div>
        )}

        {c.diagnostico && c.diagnostico.some((p) => p.respuestas.length > 0) && (
          <div>
            <h3 className="mb-2 text-xs font-semibold uppercase tracking-wide text-black/40">Diagnóstico · Método DEC</h3>
            <div className="flex flex-col gap-2.5">
              {c.diagnostico.filter((p) => p.respuestas.length > 0).map((p) => (
                <details key={p.pilar} className="rounded-xl bg-indigo-50 p-3">
                  <summary className="cursor-pointer text-sm font-semibold text-indigo-900">{p.titulo} ({p.respuestas.length})</summary>
                  <div className="mt-2 flex flex-col gap-2">
                    {p.respuestas.map((r, i) => (
                      <div key={i}>
                        <p className="text-xs font-medium text-indigo-900/70">{r.pregunta}</p>
                        <p className="text-sm text-indigo-900">{r.respuesta}</p>
                      </div>
                    ))}
                  </div>
                </details>
              ))}
            </div>
          </div>
        )}
      </div>

      <FichaPropiedad open={fichaAbierta} onClose={() => setFichaAbierta(false)} captacion={c} contacto={contactos.find((x) => x.id === c.contactoId)} />
      <AnalisisMercado open={acmAbierto} onClose={() => setAcmAbierto(false)} captacion={c} onGuardar={(datos) => onGuardarACM(c.id, datos)} />
    </Modal>
  );
}

// ---------- Agenda ----------

function Agenda({ contactos, actividades, contactoNombre, onCrear, onCompletar, onReprogramar, onCancelar, registrarContacto, onAbrirContacto }) {
  const [vista, setVista] = useState("lista"); // 'lista' | 'calendario'
  const [modoCal, setModoCal] = useState("mes"); // 'dia' | 'mes'
  const [fechaSel, setFechaSel] = useState(new Date());
  const [mesRef, setMesRef] = useState(new Date());
  const [estado, setEstado] = useState("pendiente");
  const [crearAbierto, setCrearAbierto] = useState(false);
  const [enFoco, setEnFoco] = useState(null);
  const [accion, setAccion] = useState(null);

  const filtradas = actividades.filter((a) => a.estado === estado).sort((a, b) => a.fechaHora.localeCompare(b.fechaHora));
  const grupos = useMemo(() => {
    const map = new Map();
    filtradas.forEach((a) => {
      const key = a.fechaHora.slice(0, 10);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(a);
    });
    return Array.from(map.entries());
  }, [filtradas]);

  // Calendario: solo actividades que el asesor programó activamente (visitas, llamadas, reuniones, tareas…),
  // sin los toques de seguimiento del Círculo de Influencia (esos ya se gestionan desde el Inicio).
  const actividadesCalendario = actividades.filter((a) => a.tipo !== "seguimiento");
  const actividadesDelDia = actividadesCalendario
    .filter((a) => mismoDia(new Date(a.fechaHora), fechaSel))
    .sort((a, b) => a.fechaHora.localeCompare(b.fechaHora));
  const diasDelMes = useMemo(() => obtenerDiasCalendario(mesRef), [mesRef]);

  function abrirDia(fecha) {
    setFechaSel(fecha);
    setModoCal("dia");
  }

  return (
    <div>
      <SectionHeader title="Agenda" subtitle="Llamadas, visitas y tareas" action={<Button onClick={() => setCrearAbierto(true)}><Icon.Plus className="h-4 w-4" />Nueva</Button>} />

      <div className="mb-5 flex gap-1.5">
        <Chip activo={vista === "lista"} onClick={() => setVista("lista")}>Lista</Chip>
        <Chip activo={vista === "calendario"} onClick={() => setVista("calendario")}>📅 Calendario</Chip>
      </div>

      {vista === "lista" && (
        <>
          <div className="mb-5 flex gap-1.5">
            {["pendiente", "completada", "cancelada"].map((e) => (
              <button key={e} onClick={() => setEstado(e)} className={`rounded-full px-3 py-1.5 text-xs font-medium transition ${estado === e ? "bg-emerald-700 text-white" : "bg-white text-black/55 border border-black/10"}`}>
                {e === "pendiente" ? "Pendientes" : e === "completada" ? "Completadas" : "Canceladas"}
              </button>
            ))}
          </div>

          {grupos.length === 0 ? <EmptyState title="No hay actividades aquí" hint="Crea llamadas, visitas o tareas y vincúlalas a un contacto." /> : (
            grupos.map(([dia, items]) => (
              <section key={dia} className="mb-7">
                <h2 className="mb-2.5 text-sm font-semibold text-black/50">{formatDia(items[0].fechaHora)}</h2>
                <div className="flex flex-col gap-2.5">
                  {items.map((a) => (
                    <ActividadCard key={a.id} a={a} contactoNombre={contactoNombre}
                      onAbrir={() => { setEnFoco(a); setAccion("completar"); }}
                      onReprogramar={() => { setEnFoco(a); setAccion("reprogramar"); }} />
                  ))}
                </div>
              </section>
            ))
          )}
        </>
      )}

      {vista === "calendario" && (
        <>
          <div className="mb-5 flex gap-1.5">
            <Chip activo={modoCal === "dia"} onClick={() => setModoCal("dia")}>Día</Chip>
            <Chip activo={modoCal === "mes"} onClick={() => setModoCal("mes")}>Mes</Chip>
          </div>

          {modoCal === "dia" && (
            <div>
              <div className="mb-5 flex items-center justify-between">
                <button onClick={() => setFechaSel((f) => sumarDias(f, -1))} className="flex h-11 w-11 items-center justify-center rounded-full border border-black/10 bg-white text-lg font-bold text-gray-600">‹</button>
                <button onClick={() => setFechaSel(new Date())} className="text-center">
                  <p className="text-base font-bold capitalize text-gray-900">{formatDia(fechaSel.toISOString())}</p>
                  <p className="text-xs text-black/40">{fechaSel.toLocaleDateString("es-SV", { day: "numeric", month: "long", year: "numeric" })}</p>
                </button>
                <button onClick={() => setFechaSel((f) => sumarDias(f, 1))} className="flex h-11 w-11 items-center justify-center rounded-full border border-black/10 bg-white text-lg font-bold text-gray-600">›</button>
              </div>

              {actividadesDelDia.length === 0 ? (
                <EmptyState title="Sin actividades programadas" hint="No tienes visitas, llamadas ni tareas para este día." />
              ) : (
                <div className="flex flex-col gap-2.5">
                  {actividadesDelDia.map((a) => (
                    <ActividadCard key={a.id} a={a} contactoNombre={contactoNombre}
                      onAbrir={() => { setEnFoco(a); setAccion("completar"); }}
                      onReprogramar={() => { setEnFoco(a); setAccion("reprogramar"); }} />
                  ))}
                </div>
              )}
            </div>
          )}

          {modoCal === "mes" && (
            <div>
              <div className="mb-4 flex items-center justify-between">
                <button onClick={() => setMesRef((f) => sumarMeses(f, -1))} className="flex h-11 w-11 items-center justify-center rounded-full border border-black/10 bg-white text-lg font-bold text-gray-600">‹</button>
                <p className="text-base font-bold capitalize text-gray-900">{MESES_LABEL[mesRef.getMonth()]} {mesRef.getFullYear()}</p>
                <button onClick={() => setMesRef((f) => sumarMeses(f, 1))} className="flex h-11 w-11 items-center justify-center rounded-full border border-black/10 bg-white text-lg font-bold text-gray-600">›</button>
              </div>

              <div className="mb-1.5 grid grid-cols-7 gap-1 text-center">
                {DIAS_SEMANA_CORTO.map((d, i) => <span key={i} className="text-xs font-semibold text-black/40">{d}</span>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {diasDelMes.map((dia, i) => {
                  const delMesActual = dia.getMonth() === mesRef.getMonth();
                  const actsDia = actividadesCalendario.filter((a) => mismoDia(new Date(a.fechaHora), dia));
                  const hoy = mismoDia(dia, new Date());
                  return (
                    <button key={i} onClick={() => abrirDia(dia)}
                      className={`flex flex-col items-center gap-1 rounded-xl py-2 ${hoy ? "bg-emerald-700 text-white" : delMesActual ? "bg-white text-gray-800" : "text-black/25"} ${!hoy ? "border border-black/5" : ""}`}>
                      <span className="text-sm font-semibold">{dia.getDate()}</span>
                      <span className="flex h-1.5 gap-0.5">
                        {actsDia.slice(0, 3).map((a, j) => (
                          <span key={j} className={`h-1.5 w-1.5 rounded-full ${hoy ? "bg-white" : a.estado === "pendiente" ? "bg-emerald-600" : "bg-gray-300"}`} />
                        ))}
                      </span>
                    </button>
                  );
                })}
              </div>
              <p className="mt-4 text-center text-xs text-black/40">Toca un día para ver sus actividades.</p>
            </div>
          )}
        </>
      )}

      <CrearActividadModal open={crearAbierto} onClose={() => setCrearAbierto(false)} contactos={contactos} onCrear={(d) => { onCrear(d); setCrearAbierto(false); }} />
      <AccionModal actividad={enFoco} accion={accion} contacto={enFoco ? contactos.find((c) => c.id === enFoco.contactoId) : null} registrarContacto={registrarContacto} onAbrirContacto={onAbrirContacto}
        onClose={() => { setEnFoco(null); setAccion(null); }}
        onCompletar={(r) => { onCompletar(enFoco.id, r, null); setEnFoco(null); setAccion(null); }}
        onReprogramar={(f) => { onReprogramar(enFoco.id, f); setEnFoco(null); setAccion(null); }}
        onCancelar={() => { onCancelar(enFoco.id); setEnFoco(null); setAccion(null); }} />
    </div>
  );
}

function CrearActividadModal({ open, onClose, onCrear, contactos }) {
  const [titulo, setTitulo] = useState("");
  const [tipo, setTipo] = useState("llamada");
  const [contactoId, setContactoId] = useState("");
  const [fecha, setFecha] = useState(toLocalInput(new Date().toISOString()));

  function guardar() {
    if (!titulo) return;
    onCrear({ titulo, tipo, contactoId: contactoId || null, oportunidadId: null, fechaHora: new Date(fecha).toISOString(), duracion: 30 });
    setTitulo(""); setContactoId("");
  }

  return (
    <Modal open={open} onClose={onClose} title="Nueva actividad">
      <div className="flex flex-col gap-4">
        <Field label="Título *"><input className={inputClass} value={titulo} onChange={(e) => setTitulo(e.target.value)} placeholder="Ej. Llamar para confirmar visita" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Tipo">
            <select className={inputClass} value={tipo} onChange={(e) => setTipo(e.target.value)}>
              {TIPOS_ACT.map((t) => <option key={t} value={t}>{TIPO_ACT_LABEL[t]}</option>)}
            </select>
          </Field>
          <Field label="Fecha y hora"><input type="datetime-local" className={inputClass} value={fecha} onChange={(e) => setFecha(e.target.value)} /></Field>
        </div>
        <Field label="Contacto relacionado (opcional)">
          <select className={inputClass} value={contactoId} onChange={(e) => setContactoId(e.target.value)}>
            <option value="">Sin contacto</option>
            {contactos.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
        </Field>
        <Button className="self-end" onClick={guardar} disabled={!titulo}>Crear actividad</Button>
      </div>
    </Modal>
  );
}
