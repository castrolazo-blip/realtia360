const conHora = (offsetDias, h = 12, m = 0) => {
  const d = new Date(hoy);
  d.setDate(d.getDate() + offsetDias);
  d.setHours(h, m, 0, 0);
  return d.toISOString();
};
const fmtMesDia = (iso) => {
  const d = new Date(iso);
  return `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const diasDesde = (iso) => (iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null);
const haceTiempo = (iso) => {
  const dias = diasDesde(iso);
  if (dias == null) return "";
  if (dias === 0) return "Hoy";
  if (dias === 1) return "Ayer";
  if (dias < 30) return `Hace ${dias} días`;
  const meses = Math.floor(dias / 30);
  return meses === 1 ? "Hace 1 mes" : `Hace ${meses} meses`;
};
const diasHastaProximoCumple = (mesDia) => {
  if (!mesDia) return null;
  const [mes, dia] = mesDia.split("-").map(Number);
  const t = new Date();
  let prox = new Date(t.getFullYear(), mes - 1, dia);
  if (prox < new Date(t.getFullYear(), t.getMonth(), t.getDate())) prox = new Date(t.getFullYear() + 1, mes - 1, dia);
  return Math.round((prox - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
};

// Genera una tarjeta de contacto estándar (vCard 3.0) que cualquier celular reconoce
// para ofrecer "Agregar a contactos" — es el único mecanismo real desde una web,
// ya que los navegadores no permiten escribir directo a la libreta de contactos.
function contactoToVCard(c) {
  const lineas = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `FN:${c.nombre}`,
    c.empresa ? `ORG:${c.empresa}` : "",
    c.profesion ? `TITLE:${c.profesion}` : "",
    c.telefono ? `TEL;TYPE=CELL:${c.telefono.replace(/[^\d+]/g, "")}` : "",
    c.correo ? `EMAIL:${c.correo}` : "",
    c.ciudad ? `ADR;TYPE=HOME:;;${c.ciudad};;;;` : "",
    `NOTE:Contacto de RE/MAX Expansion (Ronald Castro).${c.circulo ? ` Círculo: ${CIRCULO_LABEL[c.circulo]}.` : ""}`,
    "END:VCARD",
  ].filter(Boolean);
  return lineas.join("\n");
}

async function guardarEnContactosDelCelular(contacto) {
  const vcard = contactoToVCard(contacto);
  const nombreArchivo = `${contacto.nombre.replace(/\s+/g, "_")}.vcf`;
  const blob = new Blob([vcard], { type: "text/vcard" });

  // En celular: intenta abrir la hoja nativa de compartir (permite elegir "Contactos" directamente).
  try {
    const file = new File([blob], nombreArchivo, { type: "text/vcard" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: contacto.nombre });
      return;
    }
  } catch (e) {
    // Si el usuario cancela o el navegador no soporta compartir archivos, seguimos con la descarga.
  }

  // Alternativa universal: descarga el .vcf; el teléfono lo abre con la app de Contactos.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

// ---------- Formato ----------

const formatMoney = (v) => (v == null ? "—" : new Intl.NumberFormat("es-SV", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(v));
const formatHora = (iso) => new Date(iso).toLocaleTimeString("es-SV", { hour: "numeric", minute: "2-digit" });
const mismoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const formatDia = (iso) => {
  const d = new Date(iso);
  const t = new Date();
  const manana = new Date(t); manana.setDate(t.getDate() + 1);
  const ayer = new Date(t); ayer.setDate(t.getDate() - 1);
  if (mismoDia(d, t)) return "Hoy";
  if (mismoDia(d, manana)) return "Mañana";
  if (mismoDia(d, ayer)) return "Ayer";
  return d.toLocaleDateString("es-SV", { weekday: "short", day: "numeric", month: "short" });
};
const toLocalInput = (iso) => {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

const DIAS_SEMANA_CORTO = ["D", "L", "M", "M", "J", "V", "S"];
const MESES_LABEL = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

function obtenerDiasCalendario(fechaRef) {
  const inicioMes = new Date(fechaRef.getFullYear(), fechaRef.getMonth(), 1);
  const finMes = new Date(fechaRef.getFullYear(), fechaRef.getMonth() + 1, 0);
  const inicio = new Date(inicioMes); inicio.setDate(inicio.getDate() - inicio.getDay());
  const fin = new Date(finMes); fin.setDate(fin.getDate() + (6 - fin.getDay()));
  const dias = [];
  const cursor = new Date(inicio);
  while (cursor <= fin) { dias.push(new Date(cursor)); cursor.setDate(cursor.getDate() + 1); }
  return dias;
}
function sumarDias(fecha, n) { const d = new Date(fecha); d.setDate(d.getDate() + n); return d; }
function sumarMeses(fecha, n) { const d = new Date(fecha); d.setMonth(d.getMonth() + n); return d; }

// Motor de sugerencias del Círculo de Influencia: reglas simples sobre los datos reales
// (días desde el último contacto, cumpleaños próximos, clientes anteriores olvidados).
function generarSugerencias(contactos) {
  const sugerencias = [];
  for (const c of contactos) {
    const dias = diasDesde(c.ultimoContacto);
    if (dias != null && dias >= 30 && c.circulo) {
      sugerencias.push({
        id: `contacto-${c.id}`, contacto: c, icono: "💬",
        texto: `Hace ${dias} días que no hablás con ${c.nombre.split(" ")[0]}, de tu círculo de ${CIRCULO_LABEL[c.circulo]}. Un saludo puede reabrir la relación.`,
      });
    }
    const diasCumple = diasHastaProximoCumple(c.cumpleanos);
    if (diasCumple != null && diasCumple <= 3) {
      sugerencias.push({
        id: `cumple-${c.id}`, contacto: c, icono: "🎂",
        texto: diasCumple === 0 ? `${c.nombre.split(" ")[0]} cumple años hoy. Es buen momento para una felicitación personalizada.` : `${c.nombre.split(" ")[0]} cumple años en ${diasCumple} día(s). Prepará una felicitación personalizada.`,
      });
    }
  }
  const clientesOlvidados = contactos.filter((c) => c.circulo === "clientes_anteriores" && (diasDesde(c.ultimoContacto) || 0) > 90);
  if (clientesOlvidados.length > 0) {
    sugerencias.push({
      id: "clientes-olvidados", contacto: null, icono: "📊",
      texto: `Tenés ${clientesOlvidados.length} persona(s) en tu círculo de Clientes anteriores sin contacto en más de 90 días. Buen momento para compartir un informe de mercado.`,
    });
  }
  return sugerencias.sort((a, b) => (b.contacto ? diasDesde(b.contacto.ultimoContacto) || 0 : 0) - (a.contacto ? diasDesde(a.contacto.ultimoContacto) || 0 : 0));
}

  Mail: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...p}><rect x="3.3" y="5" width="17.4" height="14" rx="2.2" /><path strokeLinecap="round" strokeLinejoin="round" d="m4.3 6.2 7.7 6 7.7-6" /></svg>,

const TIPO_ICON = { llamada: Icon.Phone, reunion: Icon.Users, visita: Icon.Home, captacion: Icon.Home, seguimiento: Icon.Phone, informe: Icon.File, documento: Icon.File, tarea: Icon.Check };

const NAV = [
  { key: "midia", label: "Inicio", icon: Icon.Home },
  { key: "contactos", label: "Contactos", icon: Icon.Users },
  { key: "oportunidades", label: "Oportunidades", icon: Icon.Target },
  { key: "captacion", label: "Captación", icon: Icon.Clipboard },
  { key: "agenda", label: "Agenda", icon: Icon.Calendar },
];

const ACCIONES_RAPIDAS = [
  { key: "llamar", label: "Llamar", icon: Icon.Phone, accent: "bg-emerald-50 text-emerald-700" },
  { key: "whatsapp", label: "WhatsApp", icon: Icon.Whatsapp, accent: "bg-emerald-50 text-emerald-700" },
  { key: "email", label: "Correo", icon: Icon.Mail, accent: "bg-sky-50 text-sky-700" },
  { key: "agenda", label: "Nueva\nactividad", icon: Icon.Calendar, accent: "bg-amber-50 text-amber-700" },
  { key: "contactos", label: "Nuevo\ncontacto", icon: Icon.Users, accent: "bg-emerald-50 text-emerald-700" },
  { key: "oportunidades", label: "Nueva\noportunidad", icon: Icon.Target, accent: "bg-emerald-50 text-emerald-700" },

// ---------- App ----------

function App() {
  const [vista, setVista] = useState("midia");
  const [contactos, setContactos] = useState(CONTACTOS_INICIALES);
  const [oportunidades, setOportunidades] = useState(OPORTUNIDADES_INICIALES);
  const [actividades, setActividades] = useState(ACTIVIDADES_INICIALES);
  const [captaciones, setCaptaciones] = useState(CAPTACIONES_INICIALES);
  const [crearContactoAbierto, setCrearContactoAbierto] = useState(false);
  const [crearOportunidadAbierto, setCrearOportunidadAbierto] = useState(false);
  const [crearCaptacionAbierto, setCrearCaptacionAbierto] = useState(false);
  const [crearActividadAbierto, setCrearActividadAbierto] = useState(false);
  const [contactarTipo, setContactarTipo] = useState(null); // 'llamar' | 'whatsapp' | 'email'
  const [expedienteId, setExpedienteId] = useState(null); // contacto cuyo expediente está abierto

  const contactoNombre = (id) => contactos.find((c) => c.id === id)?.nombre || "—";
  const registrarContacto = registrarContactoBuilder(crearActividad);
  const abrirExpediente = (id) => setExpedienteId(id);
  const cerrarExpediente = () => setExpedienteId(null);

  function agregarNota(contactoId, texto) {
    if (!texto.trim()) return;
    setContactos((prev) => prev.map((c) => (
      c.id === contactoId
        ? { ...c, ultimoContacto: new Date().toISOString(), notas: [{ id: newId(), fecha: new Date().toISOString(), texto }, ...(c.notas || [])] }
        : c
    )));
  }

  function crearContacto(data) { setContactos((prev) => [{ id: newId(), ...data }, ...prev]); }
  function crearOportunidad(data) { setOportunidades((prev) => [{ id: newId(), estado: "activa", etapa: "nueva", ...data }, ...prev]); }
  function cerrarOportunidad(id, estado, motivo) { setOportunidades((prev) => prev.map((o) => (o.id === id ? { ...o, estado, motivoCierre: motivo } : o))); }
  function crearCaptacion(data) {
    setCaptaciones((prev) => [{ id: newId(), estado: "borrador", checklist: nuevoChecklist(), creadoEn: new Date().toISOString(), ...data }, ...prev]);
  }
  function toggleChecklistCaptacion(captacionId, itemId) {
    setCaptaciones((prev) => prev.map((c) => (
      c.id === captacionId
        ? { ...c, checklist: c.checklist.map((it) => (it.id === itemId ? { ...it, completado: !it.completado } : it)) }
        : c
    )));
  }
  function cambiarEstadoCaptacion(captacionId, nuevoEstado) {
    const cap = captaciones.find((c) => c.id === captacionId);
    if (!cap) return { ok: false, error: "Captación no encontrada" };
    if (nuevoEstado === "publicada" && cap.checklist.some((it) => !it.completado)) {
      return { ok: false, error: "No se puede publicar: faltan documentos del checklist." };
    }
    setCaptaciones((prev) => prev.map((c) => (c.id === captacionId ? { ...c, estado: nuevoEstado } : c)));
    return { ok: true };
  }
  function guardarACM(captacionId, datos) {
    setCaptaciones((prev) => prev.map((c) => (c.id === captacionId ? { ...c, acm: datos } : c)));
  }
  function crearActividad(data) { setActividades((prev) => [{ id: newId(), estado: "pendiente", ...data }, ...prev]); }
  function completarActividad(id, resultado, siguiente) {
    let contactoId = null;
    setActividades((prev) => {
      const base = prev.find((a) => a.id === id);
      contactoId = base?.contactoId || null;
      let next = prev.map((a) => (a.id === id ? { ...a, estado: "completada", resultado } : a));
      if (siguiente) {
        next = [{ id: newId(), estado: "pendiente", contactoId: base.contactoId, oportunidadId: base.oportunidadId, tipo: base.tipo, ...siguiente }, ...next];
      }
      return next;
    });
    if (resultado && resultado.trim() && contactoId) agregarNota(contactoId, resultado.trim());
  }
  function reprogramarActividad(id, fechaHora) { setActividades((prev) => prev.map((a) => (a.id === id ? { ...a, fechaHora } : a))); }
  function cancelarActividad(id) { setActividades((prev) => prev.map((a) => (a.id === id ? { ...a, estado: "cancelada" } : a))); }

  function manejarAccionRapida(key) {
    if (key === "contactos") setCrearContactoAbierto(true);
    else if (key === "oportunidades") setCrearOportunidadAbierto(true);
    else if (key === "captacion") setCrearCaptacionAbierto(true);
    else if (key === "agenda") setCrearActividadAbierto(true);
    else if (key === "contactos-todos") setVista("contactos");
    else if (key === "llamar" || key === "whatsapp" || key === "email") setContactarTipo(key);
  }

  return (
    <div className="min-h-screen bg-gray-50 pb-20 sm:pb-0 sm:pl-64 font-sans text-gray-900">
      {/* Sidebar escritorio */}
      <aside className="hidden sm:fixed sm:inset-y-0 sm:left-0 sm:flex sm:w-64 sm:flex-col sm:border-r sm:border-black/5 sm:bg-white sm:px-5 sm:py-6">
        <div className="mb-8 flex items-center gap-2.5 px-1">
          <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-emerald-700 text-base font-bold text-white">M</div>
          <div>
            <p className="text-base font-bold leading-tight text-gray-900">Mi Cartera</p>
            <p className="text-[11px] uppercase tracking-wider text-black/40">Demo · datos de ejemplo</p>
          </div>
        </div>
        <nav className="flex flex-1 flex-col gap-1">
          {NAV.map((item) => (
            <button key={item.key} onClick={() => setVista(item.key)}
              className={`flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition text-left ${vista === item.key ? "bg-emerald-700 text-white" : "text-gray-600 hover:bg-emerald-50"}`}>
              <item.icon className="h-[1.125rem] w-[1.125rem]" />{item.label}
            </button>
          ))}
        </nav>
        <div className="rounded-xl bg-emerald-50 p-3">
          <p className="truncate text-sm font-medium text-gray-900">RE/MAX Expansion</p>
          <div className="mt-1 flex items-center justify-between">
            <span className="text-xs text-black/45">Ronald Castro</span>
            <Badge className="bg-emerald-100 text-emerald-700" icon={<Icon.Shield className="h-3 w-3" />}>premium</Badge>
          </div>
        </div>
      </aside>

      <main className="mx-auto max-w-5xl sm:px-8 sm:py-8">
        {vista === "midia" && (
          <Inicio contactos={contactos} oportunidades={oportunidades} actividades={actividades} captaciones={captaciones}
            contactoNombre={contactoNombre}
            onCompletar={completarActividad} onReprogramar={reprogramarActividad} onCancelar={cancelarActividad}
            irAOportunidades={() => setVista("oportunidades")} irACaptacion={() => setVista("captacion")}
            onAccionRapida={manejarAccionRapida} registrarContacto={registrarContacto} onAbrirContacto={abrirExpediente} />
        )}
        {vista !== "midia" && (
          <div className="px-4 py-6 sm:px-0 sm:py-0">
            {vista === "contactos" && <Contactos contactos={contactos} oportunidades={oportunidades} actividades={actividades} onCrear={crearContacto} onAbrirContacto={abrirExpediente} />}
            {vista === "oportunidades" && (
              <Oportunidades contactos={contactos} oportunidades={oportunidades} contactoNombre={contactoNombre} onCrear={crearOportunidad} onCerrar={cerrarOportunidad} />
            )}
            {vista === "captacion" && (
              <Captacion contactos={contactos} captaciones={captaciones} contactoNombre={contactoNombre}
                onCrear={crearCaptacion} onToggleChecklist={toggleChecklistCaptacion} onCambiarEstado={cambiarEstadoCaptacion} onAbrirContacto={abrirExpediente} onGuardarACM={guardarACM} />
            )}
            {vista === "agenda" && (
              <Agenda contactos={contactos} actividades={actividades} contactoNombre={contactoNombre}
                onCrear={crearActividad} onCompletar={completarActividad} onReprogramar={reprogramarActividad} onCancelar={cancelarActividad} registrarContacto={registrarContacto} onAbrirContacto={abrirExpediente} />
            )}
          </div>
        )}
      </main>

      {/* Nav inferior móvil */}
      <nav className="fixed inset-x-0 bottom-0 z-40 flex border-t border-black/5 bg-white sm:hidden">
        {NAV.map((item) => (
          <button key={item.key} onClick={() => setVista(item.key)}
            className={`flex flex-1 flex-col items-center gap-1 py-2.5 text-[11px] font-medium ${vista === item.key ? "text-emerald-700" : "text-black/40"}`}>
            <item.icon className="h-5 w-5" />{item.label}
          </button>
        ))}
      </nav>

      <CrearContactoModal open={crearContactoAbierto} onClose={() => setCrearContactoAbierto(false)} onCrear={(d) => { crearContacto(d); setCrearContactoAbierto(false); }} />
      <CrearOportunidadModal open={crearOportunidadAbierto} onClose={() => setCrearOportunidadAbierto(false)} contactos={contactos} onCrear={(d) => { crearOportunidad(d); setCrearOportunidadAbierto(false); }} />
      <CaptacionGuiada open={crearCaptacionAbierto} onClose={() => setCrearCaptacionAbierto(false)} contactos={contactos} onCrear={(d) => { crearCaptacion(d); setCrearCaptacionAbierto(false); }} />
      <CrearActividadModal open={crearActividadAbierto} onClose={() => setCrearActividadAbierto(false)} contactos={contactos} onCrear={(d) => { crearActividad(d); setCrearActividadAbierto(false); }} />
      <ContactarModal tipo={contactarTipo} onClose={() => setContactarTipo(null)} contactos={contactos} onRegistrar={registrarContacto} />
      <DetalleContactoModal id={expedienteId} contactos={contactos} oportunidades={oportunidades} actividades={actividades}
        onClose={cerrarExpediente} registrarContacto={registrarContacto} onAgregarNota={agregarNota} />
    </div>
  );
}

// ---------- Inicio (estilo app de servicios) ----------

function Inicio({ contactos, oportunidades, actividades, captaciones, contactoNombre, onCompletar, onReprogramar, onCancelar, irAOportunidades, irACaptacion, onAccionRapida, registrarContacto, onAbrirContacto }) {
  const [enFoco, setEnFoco] = useState(null);
  const [accion, setAccion] = useState(null);

  const { vencidas, deHoy, proximas } = useMemo(() => {
    const t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const t1 = new Date(); t1.setHours(23, 59, 59, 999);
    const en7 = new Date(t1.getTime() + 7 * 86400000);
    const pendientes = actividades.filter((a) => a.estado === "pendiente");
    return {
      vencidas: pendientes.filter((a) => new Date(a.fechaHora) < t0).sort((a, b) => a.fechaHora.localeCompare(b.fechaHora)),
      deHoy: pendientes.filter((a) => new Date(a.fechaHora) >= t0 && new Date(a.fechaHora) <= t1).sort((a, b) => a.fechaHora.localeCompare(b.fechaHora)),
      proximas: pendientes.filter((a) => new Date(a.fechaHora) > t1 && new Date(a.fechaHora) <= en7).sort((a, b) => a.fechaHora.localeCompare(b.fechaHora)),
    };
  }, [actividades]);

  const sugerencias = useMemo(() => generarSugerencias(contactos), [contactos]);
  const alertas = oportunidades.filter((o) => o.estado === "activa" && (!o.proximaAccion || !o.proximaFecha));
  const captacionesIncompletas = (captaciones || []).filter((c) => c.estado !== "publicada" && c.checklist.some((it) => !it.completado));
  const todasHoyYVencidas = [...vencidas, ...deHoy];

  return (
    <div>
      {/* Barra superior tipo ubicación */}
      <div className="flex items-center justify-between bg-white px-4 py-3 sm:rounded-t-3xl sm:px-6 sm:pt-6">
        <div className="flex items-center gap-1.5 text-gray-900">
          <Icon.Pin className="h-[1.125rem] w-[1.125rem] text-emerald-700" />
          <div className="leading-tight">
            <p className="text-sm font-semibold">RE/MAX Expansion, San Salvador</p>
            <p className="text-xs text-black/40">Cartera de Ronald Castro</p>
          </div>
          <Icon.ChevronDown className="h-4 w-4 text-black/30" />
        </div>
        <div className="flex items-center gap-2">
          <button className="relative flex h-9 w-9 items-center justify-center rounded-full bg-gray-100">
            <Icon.Bell className="h-[1.125rem] w-[1.125rem] text-gray-600" />
            {alertas.length > 0 && <span className="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-rose-500" />}
          </button>
          <div className="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-700 text-sm font-bold text-white">R</div>
        </div>
      </div>

      {/* Buscador */}
      <div className="bg-white px-4 pb-4 sm:rounded-b-3xl sm:px-6">
        <div className="flex items-center gap-2 rounded-2xl border border-black/10 bg-gray-50 px-3.5 py-3">
          <Icon.Search className="h-[1.125rem] w-[1.125rem] text-black/35" />
          <span className="flex-1 text-sm text-black/35">Buscar contacto, oportunidad o zona</span>
          <Icon.Filter className="h-[1.125rem] w-[1.125rem] text-black/35" />
        </div>
      </div>

      <div className="px-4 py-5 sm:px-0">
        {/* Banner hero */}
        <div className="relative mb-6 overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-800 to-emerald-700 p-6 text-white">
          <div className="absolute -right-6 -top-6 h-32 w-32 rounded-full bg-white/5" />
          <div className="absolute -bottom-10 right-10 h-28 w-28 rounded-full bg-white/5" />
          <p className="relative text-lg font-bold leading-snug">
            {alertas.length > 0 ? `${alertas.length} oportunidad(es) sin próxima acción` : "Tu cartera está al día"}
          </p>
          <p className="relative mt-1 text-sm text-emerald-100">
            {alertas.length > 0 ? "Resuélvelo antes de que se te escape el negocio." : "Sigue así — cero pendientes críticos por ahora."}
          </p>
          <div className="relative mt-4 flex flex-wrap gap-2">
            <button onClick={irAOportunidades} className="inline-flex items-center gap-1.5 rounded-full bg-white px-4 py-2 text-sm font-semibold text-emerald-800">
              <Icon.Bolt className="h-4 w-4" /> Ver oportunidades
            </button>
            <button onClick={() => onAccionRapida("agenda")} className="inline-flex items-center gap-1.5 rounded-full border border-white/40 px-4 py-2 text-sm font-semibold text-white">
              <Icon.Calendar className="h-4 w-4" /> Agendar seguimiento
            </button>
          </div>
        </div>

        {/* Sugerencias del Círculo de Influencia */}
        {sugerencias.length > 0 && (
          <div className="mb-6">
            <div className="mb-3 flex items-center justify-between">
              <h2 className="text-base font-bold text-gray-900">Sugerencias de tu Círculo</h2>
              <span className="text-xs font-medium text-emerald-700">{sugerencias.length}</span>
            </div>
            <div className="flex flex-col gap-3">
              {sugerencias.slice(0, 3).map((s) => (
                <Card key={s.id} className="p-4">
                  <div className="flex items-start gap-3">
                    <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-amber-50 text-lg">{s.icono}</span>
                    <div className="min-w-0 flex-1">
                      <p className="text-sm text-gray-800">{s.texto}</p>
                      {s.contacto?.notas?.[0] && (
                        <p className="mt-1.5 rounded-lg bg-gray-50 px-2.5 py-2 text-xs italic text-gray-500">
                          💬 “{s.contacto.notas[0].texto}”
                        </p>
                      )}
                    </div>
                  </div>
                  {s.contacto && (
                    <button onClick={() => onAbrirContacto(s.contacto.id)}
                      className="mt-3 flex w-full items-center justify-between gap-3 rounded-xl border border-black/10 px-3 py-2.5 text-left hover:bg-gray-50">
                      <div className="flex items-center gap-2.5 min-w-0">
                        <span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-xs font-bold text-emerald-700">
                          {s.contacto.nombre.charAt(0).toUpperCase()}
                        </span>
                        <div className="min-w-0">
                          <p className="truncate text-sm font-semibold text-gray-900">{s.contacto.nombre}</p>
                          <p className="truncate text-[11px] text-black/40">{CIRCULO_EMOJI[s.contacto.circulo]} {CIRCULO_LABEL[s.contacto.circulo]}</p>
                        </div>
                      </div>
                      <span className="flex items-center gap-1 shrink-0 text-xs font-medium text-emerald-700">
                        Ver expediente <Icon.Chevron className="h-3.5 w-3.5" />
                      </span>
                    </button>
                  )}
                </Card>
              ))}
            </div>
          </div>
        )}

        {captacionesIncompletas.length > 0 && (
          <button onClick={irACaptacion} className="mb-6 flex w-full items-center justify-between gap-3 rounded-2xl border border-orange-200 bg-orange-50 p-4 text-left hover:bg-orange-100">
            <div className="flex items-center gap-3">
              <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-orange-100 text-orange-700">
                <Icon.Clipboard className="h-5 w-5" />
              </span>
              <div>
                <p className="text-sm font-semibold text-orange-700">{captacionesIncompletas.length} captación(es) con documentos pendientes</p>
                <p className="text-xs text-black/50">No se pueden publicar hasta completar el checklist.</p>
              </div>
            </div>
            <Icon.Chevron className="h-4 w-4 shrink-0 text-orange-400" />
          </button>
        )}

        {/* Acciones rápidas */}
        <div className="mb-6">
          <h2 className="mb-3 text-base font-bold text-gray-900">Acciones rápidas</h2>
          <div className="grid grid-cols-4 gap-3">
            {ACCIONES_RAPIDAS.map((a) => (
              <button key={a.key} onClick={() => onAccionRapida(a.key)} className="flex flex-col items-center gap-2 rounded-2xl bg-white p-3 text-center shadow-sm border border-black/5">
                <span className={`flex h-11 w-11 items-center justify-center rounded-xl ${a.accent}`}><a.icon className="h-5 w-5" /></span>
                <span className="whitespace-pre-line text-[11px] font-medium leading-tight text-gray-700">{a.label}</span>
              </button>
            ))}
          </div>
        </div>

        {/* Tu día */}
        <div className="mb-6">
          <div className="mb-3 flex items-center justify-between">
            <h2 className="text-base font-bold text-gray-900">Tu día</h2>
            <span className="text-xs font-medium text-emerald-700">{todasHoyYVencidas.length} pendientes</span>
          </div>
          {todasHoyYVencidas.length === 0 ? (
            <EmptyState title="Nada urgente hoy" hint="Tus próximas actividades aparecerán aquí." />
          ) : (
            <div className="flex flex-col gap-3">
              {vencidas.map((a) => (
                <ActividadCard key={a.id} a={a} contactoNombre={contactoNombre} urgente onAbrir={() => { setEnFoco(a); setAccion("completar"); }} onReprogramar={() => { setEnFoco(a); setAccion("reprogramar"); }} />
              ))}
              {deHoy.map((a) => (
                <ActividadCard key={a.id} a={a} contactoNombre={contactoNombre} onAbrir={() => { setEnFoco(a); setAccion("completar"); }} onReprogramar={() => { setEnFoco(a); setAccion("reprogramar"); }} />
              ))}
            </div>
          )}
        </div>

        {proximas.length > 0 && (
          <div className="mb-6">

  const meta = {
    llamar: {
      titulo: "Llamar a…", icon: Icon.Phone, actividadTipo: "llamada",
      accion: (c) => telHref(c.telefono), etiqueta: (c) => c.telefono || "Sin teléfono", disabled: (c) => !c.telefono,
    },
    whatsapp: {
      titulo: "Enviar WhatsApp a…", icon: Icon.Whatsapp, actividadTipo: "llamada",
      accion: (c) => waHref(c.telefono, `Hola ${c.nombre.split(" ")[0]}, te escribe Ronald de RE/MAX Expansion.`),

    },
    email: {
      titulo: "Enviar correo a…", icon: Icon.Mail, actividadTipo: "documento",

function Contactos({ contactos, oportunidades, actividades, onCrear, onAbrirContacto }) {
  const [q, setQ] = useState("");
  const [modo, setModo] = useState("clasificacion"); // 'clasificacion' | 'circulo'
  const [filtro, setFiltro] = useState("");
  const [crearAbierto, setCrearAbierto] = useState(false);

  function cambiarModo(m) { setModo(m); setFiltro(""); }

  const filtrados = contactos.filter((c) => {
    if (modo === "clasificacion" && filtro && c.clasificacion !== filtro) return false;
    if (modo === "circulo" && filtro && c.circulo !== filtro) return false;
    if (q && !c.nombre.toLowerCase().includes(q.toLowerCase()) && !(c.empresa || "").toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  const conteoPorCirculo = CIRCULOS.reduce((acc, key) => {
    acc[key] = contactos.filter((c) => c.circulo === key).length;
    return acc;
  }, {});

  return (
    <div>
      <SectionHeader title="Contactos" subtitle={`${contactos.length} en tu cartera`} action={<Button onClick={() => setCrearAbierto(true)}><Icon.Plus className="h-4 w-4" />Nuevo</Button>} />

      <div className="mb-4 flex items-center gap-2 rounded-2xl border border-black/10 bg-white px-3.5 py-2.5">
        <Icon.Search className="h-4 w-4 text-black/35" />
        <input placeholder="Buscar por nombre o empresa…" className="flex-1 bg-transparent text-sm outline-none" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>

      <div className="mb-4 flex gap-1.5">
        <Chip activo={modo === "clasificacion"} onClick={() => cambiarModo("clasificacion")}>Clasificación CRM</Chip>
        <Chip activo={modo === "circulo"} onClick={() => cambiarModo("circulo")}>🎯 Círculo de Influencia</Chip>
      </div>

      <div className="mb-5 flex flex-wrap gap-1.5">
        <Chip activo={filtro === ""} onClick={() => setFiltro("")}>Todos</Chip>
        {modo === "clasificacion"
          ? CLASIFICACIONES.map((c) => <Chip key={c} activo={filtro === c} onClick={() => setFiltro(c)}>{CLASIFICACION_LABEL[c]}</Chip>)
          : CIRCULOS.map((c) => (
              <Chip key={c} activo={filtro === c} onClick={() => setFiltro(c)}>
                {CIRCULO_EMOJI[c]} {CIRCULO_LABEL[c]} {conteoPorCirculo[c] > 0 && `(${conteoPorCirculo[c]})`}
              </Chip>
            ))}
      </div>

      {filtrados.length === 0 ? (
        <EmptyState title="Sin contactos" hint="Crea el primero para empezar a construir tu cartera de relaciones." />
      ) : (
        <div className="flex flex-col gap-2.5">
          {filtrados.map((c) => (
            <Card key={c.id} className="p-4">
              <button className="flex w-full items-center justify-between gap-3 text-left" onClick={() => onAbrirContacto(c.id)}>
                <div className="flex items-center gap-3 min-w-0">
                  <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-sm font-bold text-emerald-700">{c.nombre.charAt(0).toUpperCase()}</div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5">
                      <p className="truncate text-sm font-semibold text-gray-900">{c.nombre}</p>
                      {c.valorEstrategico === "vip" && <Badge className="bg-amber-100 text-amber-700">VIP</Badge>}
                    </div>
                    <p className="truncate text-xs text-black/45">{c.empresa || c.ciudad || "—"}</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  {modo === "clasificacion" ? (
                    <Badge className={TONE_BY_CLASIFICACION[c.clasificacion]}>{CLASIFICACION_LABEL[c.clasificacion]}</Badge>
                  ) : c.circulo ? (
                    <Badge className="bg-indigo-50 text-indigo-700">{CIRCULO_EMOJI[c.circulo]} {CIRCULO_LABEL[c.circulo]}</Badge>
                  ) : (
                    <Badge>Sin asignar</Badge>
                  )}
                  <Icon.Chevron className="h-4 w-4 shrink-0 text-black/25" />
                </div>
              </button>
            </Card>
          ))}
        </div>
      )}

      <CrearContactoModal open={crearAbierto} onClose={() => setCrearAbierto(false)} onCrear={(d) => { onCrear(d); setCrearAbierto(false); }} />
    </div>
  );
}

function CrearContactoModal({ open, onClose, onCrear }) {
  const [nombre, setNombre] = useState("");
  const [empresa, setEmpresa] = useState("");
  const [ciudad, setCiudad] = useState("");
  const [telefono, setTelefono] = useState("");
  const [correo, setCorreo] = useState("");
  const [clasificacion, setClasificacion] = useState("contacto_relacion");
  const [mostrarCirculo, setMostrarCirculo] = useState(false);
  const [circulo, setCirculo] = useState("");
  const [cercania, setCercania] = useState("Media");
  const [profesion, setProfesion] = useState("");
  const [cumpleanos, setCumpleanos] = useState("");
  const [potencialReferidos, setPotencialReferidos] = useState("Medio");
  const [valorEstrategico, setValorEstrategico] = useState("estandar");
  const [guardarEnCelular, setGuardarEnCelular] = useState(true);

  function guardar() {
    if (!nombre) return;
    const contacto = {
      nombre, empresa: empresa || null, ciudad: ciudad || null, telefono, correo, clasificacion,
      circulo: circulo || null, cercania, profesion: profesion || null,
      cumpleanos: cumpleanos ? cumpleanos.slice(5) : "", ultimoContacto: new Date().toISOString(),
      potencialReferidos, valorEstrategico, intereses: "",
    };
    onCrear(contacto);
    if (guardarEnCelular) guardarEnContactosDelCelular(contacto);
    setNombre(""); setEmpresa(""); setCiudad(""); setTelefono(""); setCorreo(""); setClasificacion("contacto_relacion");
    setCirculo(""); setCercania("Media"); setProfesion(""); setCumpleanos(""); setPotencialReferidos("Medio"); setValorEstrategico("estandar");
  }

  return (
    <Modal open={open} onClose={onClose} title="Nuevo contacto">
      <div className="flex flex-col gap-4">
        <Field label="Nombre completo *"><input className={inputClass} value={nombre} onChange={(e) => setNombre(e.target.value)} placeholder="Ej. Ana Beatriz Rivas" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Empresa"><input className={inputClass} value={empresa} onChange={(e) => setEmpresa(e.target.value)} /></Field>
          <Field label="Ciudad"><input className={inputClass} value={ciudad} onChange={(e) => setCiudad(e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Teléfono"><input className={inputClass} value={telefono} onChange={(e) => setTelefono(e.target.value)} placeholder="+503 7000-0000" /></Field>
          <Field label="Correo"><input className={inputClass} value={correo} onChange={(e) => setCorreo(e.target.value)} placeholder="correo@ejemplo.com" /></Field>
        </div>
        <Field label="Clasificación">
          <select className={inputClass} value={clasificacion} onChange={(e) => setClasificacion(e.target.value)}>
            {CLASIFICACIONES.map((c) => <option key={c} value={c}>{CLASIFICACION_LABEL[c]}</option>)}
          </select>
        </Field>

        <button type="button" onClick={() => setMostrarCirculo((v) => !v)} className="flex items-center justify-between rounded-xl bg-indigo-50 px-3.5 py-2.5 text-left text-sm font-medium text-indigo-700">
          🎯 Círculo de Influencia (opcional)
          <Icon.ChevronDown className={`h-4 w-4 transition ${mostrarCirculo ? "rotate-180" : ""}`} />
        </button>

        {mostrarCirculo && (
          <div className="flex flex-col gap-3 rounded-xl bg-gray-100 p-3">
            <Field label="Categoría">
              <select className={inputClass} value={circulo} onChange={(e) => setCirculo(e.target.value)}>
                <option value="">Sin categoría</option>
                {CIRCULOS.map((c) => <option key={c} value={c}>{CIRCULO_EMOJI[c]} {CIRCULO_LABEL[c]}</option>)}
              </select>
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Cercanía">
                <select className={inputClass} value={cercania} onChange={(e) => setCercania(e.target.value)}>
                  {CERCANIA_OPCIONES.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              </Field>
              <Field label="Profesión"><input className={inputClass} value={profesion} onChange={(e) => setProfesion(e.target.value)} /></Field>
            </div>
            <Field label="Cumpleaños"><input type="date" className={inputClass} value={cumpleanos} onChange={(e) => setCumpleanos(e.target.value)} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Potencial de referidos">
                <select className={inputClass} value={potencialReferidos} onChange={(e) => setPotencialReferidos(e.target.value)}>
                  {POTENCIAL_OPCIONES.map((o) => <option key={o} value={o}>{o}</option>)}
                </select>
              </Field>
              <Field label="Valor estratégico">
                <select className={inputClass} value={valorEstrategico} onChange={(e) => setValorEstrategico(e.target.value)}>
                  <option value="estandar">Estándar</option>
                  <option value="vip">VIP</option>
                </select>
              </Field>
            </div>
          </div>
        )}

        <label className="flex items-center gap-2 rounded-xl bg-gray-50 px-3.5 py-3 text-sm text-gray-700">
          <input type="checkbox" checked={guardarEnCelular} onChange={(e) => setGuardarEnCelular(e.target.checked)} />

        </label>

        <Button className="self-end" onClick={guardar} disabled={!nombre}>Guardar contacto</Button>
      </div>
    </Modal>
  );

  return (
    <div>
      <SectionHeader title="Oportunidades" subtitle={`${oportunidades.length} en el embudo`} action={<Button onClick={() => setCrearAbierto(true)}><Icon.Plus className="h-4 w-4" />Nueva</Button>} />

              <div className="flex flex-col gap-2.5">

                  <Card key={o.id} className={`p-3.5 ${(!o.proximaAccion || !o.proximaFecha) && o.estado === "activa" ? "border-l-4 border-l-rose-500" : ""}`}>
                    <div className="mb-1.5 flex items-center justify-between">
                      <Badge className="bg-emerald-50 text-emerald-700">{TIPO_OP_LABEL[o.tipo]}</Badge>
                      {o.estado !== "activa" && <Badge className={o.estado === "ganada" ? "bg-emerald-100 text-emerald-700" : "bg-black/5 text-black/60"}>{o.estado}</Badge>}

function CrearOportunidadModal({ open, onClose, onCrear, contactos }) {
  const [contactoId, setContactoId] = useState(contactos[0]?.id || "");
  const [tipo, setTipo] = useState("compra");
  const [valor, setValor] = useState("");
  const [zona, setZona] = useState("");
  const [proximaAccion, setProximaAccion] = useState("");
  const [proximaFecha, setProximaFecha] = useState("");

  function guardar() {
    if (!contactoId || !proximaAccion || !proximaFecha) return;
    onCrear({ contactoId, tipo, valor: valor ? Number(valor) : null, zona, proximaAccion, proximaFecha: new Date(proximaFecha).toISOString() });
    setValor(""); setZona(""); setProximaAccion(""); setProximaFecha("");
  }

  return (
    <Modal open={open} onClose={onClose} title="Nueva oportunidad">
      <div className="flex flex-col gap-4">
        <Field label="Contacto *">
          <select className={inputClass} value={contactoId} onChange={(e) => setContactoId(e.target.value)}>
            {contactos.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
          </select>
        </Field>
        <Field label="Tipo">
          <select className={inputClass} value={tipo} onChange={(e) => setTipo(e.target.value)}>
            {Object.keys(TIPO_OP_LABEL).map((t) => <option key={t} value={t}>{TIPO_OP_LABEL[t]}</option>)}
          </select>
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Valor estimado (USD)"><input type="number" className={inputClass} value={valor} onChange={(e) => setValor(e.target.value)} /></Field>
          <Field label="Zona"><input className={inputClass} value={zona} onChange={(e) => setZona(e.target.value)} /></Field>
        </div>
        <div className="rounded-xl bg-gray-100 p-3">
          <p className="mb-2 text-xs font-medium text-black/55">Toda oportunidad activa requiere próxima acción (regla de negocio)</p>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Próxima acción *"><input className={inputClass} value={proximaAccion} onChange={(e) => setProximaAccion(e.target.value)} placeholder="Ej. Llamar" /></Field>
            <Field label="Fecha *"><input type="datetime-local" className={inputClass} value={proximaFecha} onChange={(e) => setProximaFecha(e.target.value)} /></Field>
          </div>
        </div>
        <Button className="self-end" onClick={guardar} disabled={!contactoId || !proximaAccion || !proximaFecha}>Crear oportunidad</Button>
      </div>
    </Modal>
  );
}

function CerrarModal({ id, onClose, onCerrar }) {

              <div className="flex flex-col gap-2.5">

// Pasos: 1 bienvenida + 4 pilares DEC + 1 datos de propiedad + 1 características de espacios + 1 checklist + 1 resumen
const TOTAL_PASOS_CAPTACION = 9;

function CaptacionGuiada({ open, onClose, contactos, onCrear }) {
  const [paso, setPaso] = useState(0);
  const [contactoId, setContactoId] = useState("");
  const [tipoInmueble, setTipoInmueble] = useState("casa");
  const [operacion, setOperacion] = useState("venta");
  const [direccion, setDireccion] = useState("");
  const [zona, setZona] = useState("");
  const [precio, setPrecio] = useState("");
  const [comisionPct, setComisionPct] = useState("5");
  const [areaTerreno, setAreaTerreno] = useState("");
  const [unidadTerreno, setUnidadTerreno] = useState("varas2");
  const [areaConstruccion, setAreaConstruccion] = useState("");
  const [antiguedad, setAntiguedad] = useState("");
  const [remodelada, setRemodelada] = useState(false);
  const [amueblada, setAmueblada] = useState(false);
  const [respuestas, setRespuestas] = useState({ cliente: {}, propiedad: {}, mercado: {}, comprador: {} });
  const [espacios, setEspacios] = useState({}); // { [espacioId]: { contadores, caracteristicas, unidades } }
  const [espacioAbierto, setEspacioAbierto] = useState(null);
  const [unidadAbierta, setUnidadAbierta] = useState(null); // { contadorId, index } dentro de un espacio con unidades
  const [checklist, setChecklist] = useState(nuevoChecklist());

  if (!open) return null;

  function responder(pilarId, preguntaId, texto) {
    setRespuestas((prev) => ({ ...prev, [pilarId]: { ...prev[pilarId], [preguntaId]: texto } }));
  }
  function toggleEspacio(espacioId) {
    setEspacios((prev) => {
      if (prev[espacioId]) {
        const { [espacioId]: _quitar, ...resto } = prev;
        return resto;
      }
      return { ...prev, [espacioId]: { contadores: {}, caracteristicas: {}, unidades: {} } };
    });
    if (!espacios[espacioId]) setEspacioAbierto(espacioId);
  }
  function actualizarContador(espacioId, contadorId, valor) {
    setEspacios((prev) => {
      const catalogo = ESPACIOS_CATALOGO.find((e) => e.id === espacioId);
      const actual = prev[espacioId];
      let unidades = actual.unidades;
      if (catalogo.caracteristicasPorUnidad) {
        const listaActual = actual.unidades[contadorId] || [];
        const nuevaLista = listaActual.slice(0, valor);
        while (nuevaLista.length < valor) nuevaLista.push({ caracteristicas: {} });
        unidades = { ...actual.unidades, [contadorId]: nuevaLista };
      }
      return { ...prev, [espacioId]: { ...actual, contadores: { ...actual.contadores, [contadorId]: valor }, unidades } };
    });
  }
  function actualizarCaracteristica(espacioId, caracteristicaId, valor) {
    setEspacios((prev) => ({
      ...prev,
      [espacioId]: { ...prev[espacioId], caracteristicas: { ...prev[espacioId].caracteristicas, [caracteristicaId]: valor } },
    }));
  }
  function actualizarCaracteristicaUnidad(espacioId, contadorId, index, caracteristicaId, valor) {
    setEspacios((prev) => {
      const actual = prev[espacioId];
      const lista = actual.unidades[contadorId].slice();
      lista[index] = { ...lista[index], caracteristicas: { ...lista[index].caracteristicas, [caracteristicaId]: valor } };
      return { ...prev, [espacioId]: { ...actual, unidades: { ...actual.unidades, [contadorId]: lista } } };
    });
  }
  function toggleItemChecklist(itemId) {
    setChecklist((prev) => prev.map((it) => (it.id === itemId ? { ...it, completado: !it.completado } : it)));
  }
  function reiniciarYCerrar() {
    setPaso(0); setContactoId(""); setDireccion(""); setZona(""); setPrecio(""); setComisionPct("5");
    setRespuestas({ cliente: {}, propiedad: {}, mercado: {}, comprador: {} }); setEspacios({}); setEspacioAbierto(null); setUnidadAbierta(null);
    setChecklist(nuevoChecklist());
    onClose();
  }
  function crear() {
    const diagnostico = DEC_PILARES.map((p) => ({
      pilar: p.id, titulo: p.titulo,
      respuestas: p.preguntas.map((q) => ({ pregunta: q.texto, respuesta: respuestas[p.id][q.id] || "" })).filter((r) => r.respuesta.trim()),
    }));
    const espaciosDetalle = Object.keys(espacios).map((id) => {
      const catalogo = ESPACIOS_CATALOGO.find((e) => e.id === id);
      const datos = espacios[id];
      const contadoresConValor = catalogo.contadores
        .map((ct) => {
          const valor = datos.contadores[ct.id] || 0;
          let unidades = null;
          if (catalogo.caracteristicasPorUnidad && valor > 0) {
            unidades = (datos.unidades[ct.id] || []).map((u, idx) => ({
              etiqueta: valor > 1 ? `${ct.nombre} ${idx + 1}` : ct.nombre,
              caracteristicas: catalogo.caracteristicas
                .map((c) => ({ nombre: c.nombre, tipo: c.tipo, valor: u.caracteristicas[c.id] }))
                .filter((c) => c.valor === true || (typeof c.valor === "string" && c.valor.trim())),
            }));
          }
          return { nombre: ct.nombre, valor, unidades };
        })
        .filter((ct) => ct.valor > 0);
      return {
        id, nombre: catalogo.nombre, icono: catalogo.icono,
        cantidad: contadoresConValor.length > 0 ? contadoresConValor.reduce((n, ct) => n + ct.valor, 0) : null,
        contadores: contadoresConValor,
        caracteristicas: catalogo.caracteristicasPorUnidad ? [] : catalogo.caracteristicas
          .map((c) => ({ nombre: c.nombre, tipo: c.tipo, valor: datos.caracteristicas[c.id] }))
          .filter((c) => c.valor === true || (typeof c.valor === "string" && c.valor.trim())),
      };
    });
    onCrear({
      contactoId, tipoInmueble, operacion, direccion, zona, precio: precio ? Number(precio) : null, comisionPct: Number(comisionPct) || 0,
      areaTerreno: areaTerreno ? Number(areaTerreno) : null, areaConstruccion: areaConstruccion ? Number(areaConstruccion) : null,
      antiguedad: antiguedad ? Number(antiguedad) : null, remodelada, amueblada, unidadTerreno,
      notas: "", checklist, diagnostico, espacios: espaciosDetalle,
    });
    reiniciarYCerrar();
  }

  const esUltimoPaso = paso === TOTAL_PASOS_CAPTACION - 1;
  const puedeAvanzarPaso0 = !!contactoId;
  const puedeAvanzarPropiedad = direccion.trim().length > 0;
  const bloqueado = (paso === 0 && !puedeAvanzarPaso0) || (paso === 5 && !puedeAvanzarPropiedad);

  const tituloPaso = paso === 0 ? "Bienvenida" : paso >= 1 && paso <= 4 ? DEC_PILARES[paso - 1].titulo : paso === 5 ? "Datos de la propiedad" : paso === 6 ? "Características" : paso === 7 ? "Checklist de documentos" : "Resumen";

  return (
    <div className="fixed inset-0 z-50 flex flex-col bg-white">
      {/* Progreso */}
      <div className="shrink-0 border-b border-black/5 px-4 py-3">
        <div className="mb-2 flex items-center justify-between">
          <button onClick={reiniciarYCerrar} className="text-sm font-medium text-black/40">Cancelar</button>
          <span className="text-xs font-bold uppercase tracking-wide text-emerald-700">Paso {paso + 1} de {TOTAL_PASOS_CAPTACION} · {tituloPaso}</span>
        </div>
        <div className="h-2 w-full overflow-hidden rounded-full bg-gray-100">
          <div className="h-full rounded-full bg-emerald-600 transition-all" style={{ width: `${((paso + 1) / TOTAL_PASOS_CAPTACION) * 100}%` }} />
        </div>
      </div>

      {/* Contenido */}
      <div className="flex-1 overflow-y-auto px-4 py-6">
        {paso === 0 && (
          <div>
            <p className="text-xs font-bold uppercase tracking-widest text-emerald-700">Captación guiada</p>
            <h1 className="mt-1 text-3xl font-black text-gray-900">Método DEC</h1>
            <p className="mt-1 text-base font-semibold text-gray-500">Diagnóstico · Estrategia · Comercialización</p>
            <p className="mt-4 text-base text-gray-600">Antes de comercializar una propiedad, hacemos un diagnóstico profesional en 4 pasos para diseñar una estrategia que realmente vende — no una genérica.</p>
            <h2 className="mb-3 mt-8 text-lg font-bold text-gray-900">¿A quién le vas a captar la propiedad?</h2>
            <div className="flex flex-col gap-2.5">

// ---------- ACM · Análisis Comparativo de Mercado ----------
// Motor de reglas (no IA real): calcula similitud y sugiere ajustes de valor
// comparando la propiedad captada contra cada comparable que el asesor ingresa.

function calcularSimilitud(subject, comp) {
  let score = 100;
  if (subject.areaTerreno && comp.areaTerreno) {
    const diffPct = Math.abs(subject.areaTerreno - comp.areaTerreno) / subject.areaTerreno;
    score -= Math.min(15, diffPct * 100 * 0.6);
  }
  if (subject.areaConstruccion && comp.areaConstruccion) {
    const diffPct = Math.abs(subject.areaConstruccion - comp.areaConstruccion) / subject.areaConstruccion;
    score -= Math.min(25, diffPct * 100);
  }
  if (subject.habitaciones && comp.habitaciones != null) score -= Math.min(15, Math.abs(subject.habitaciones - comp.habitaciones) * 6);
  if (subject.banos && comp.banos != null) score -= Math.min(15, Math.abs(subject.banos - comp.banos) * 5);
  if (subject.parqueos && comp.parqueos != null) score -= Math.min(8, Math.abs(subject.parqueos - comp.parqueos) * 3);
  if (subject.remodelada !== !!comp.remodelada) score -= 8;
  if (subject.amueblada !== !!comp.amueblado) score -= 4;
  if (subject.piscina !== !!comp.piscina) score -= 5;
  if (subject.seguridad !== !!comp.seguridad) score -= 5;
  return Math.max(0, Math.round(score));
}

function calcularAjustes(subject, comp) {
  const ajustes = [];
  if (subject.habitaciones && comp.habitaciones != null && subject.habitaciones !== comp.habitaciones) {
    const diff = subject.habitaciones - comp.habitaciones;
    ajustes.push({ motivo: `${Math.abs(diff)} habitación${Math.abs(diff) > 1 ? "es" : ""} ${diff > 0 ? "menos" : "más"} que la propiedad captada`, monto: diff * 6000 });
  }
  if (subject.banos && comp.banos != null && subject.banos !== comp.banos) {
    const diff = subject.banos - comp.banos;
    ajustes.push({ motivo: `${Math.abs(diff)} baño(s) ${diff > 0 ? "menos" : "más"}`, monto: diff * 4000 });
  }
  if (subject.parqueos && comp.parqueos != null && subject.parqueos !== comp.parqueos) {
    const diff = subject.parqueos - comp.parqueos;
    ajustes.push({ motivo: `${Math.abs(diff)} parqueo(s) ${diff > 0 ? "menos" : "más"}`, monto: diff * 3000 });
  }
  if (subject.areaConstruccion && comp.areaConstruccion && Math.abs(subject.areaConstruccion - comp.areaConstruccion) >= 5) {
    const diffArea = subject.areaConstruccion - comp.areaConstruccion;
    const valorM2 = comp.areaConstruccion ? comp.precio / comp.areaConstruccion : 800;
    ajustes.push({ motivo: `${Math.abs(Math.round(diffArea))} m² ${diffArea > 0 ? "menos" : "más"} de construcción`, monto: Math.round(diffArea * valorM2 * 0.5) });
  }
  if (subject.areaTerreno && comp.areaTerreno && Math.abs(subject.areaTerreno - comp.areaTerreno) >= 10) {
    const diffTerreno = subject.areaTerreno - comp.areaTerreno;
    const valorVara2 = comp.areaTerreno ? comp.precio / comp.areaTerreno : 150;
    ajustes.push({ motivo: `${Math.abs(Math.round(diffTerreno))} v² ${diffTerreno > 0 ? "menos" : "más"} de terreno`, monto: Math.round(diffTerreno * valorVara2 * 0.3) });
  }
  if (subject.remodelada && !comp.remodelada) ajustes.push({ motivo: "Comparable no está remodelado", monto: 5000 });
  if (!subject.remodelada && comp.remodelada) ajustes.push({ motivo: "Comparable está remodelado y la propiedad captada no", monto: -5000 });
  if (subject.amueblada && !comp.amueblado) ajustes.push({ motivo: "Comparable no está amueblado", monto: 3000 });
  if (!subject.amueblada && comp.amueblado) ajustes.push({ motivo: "Comparable está amueblado y la propiedad captada no", monto: -3000 });
  if (subject.piscina && !comp.piscina) ajustes.push({ motivo: "Comparable no tiene piscina", monto: 4000 });
  if (!subject.piscina && comp.piscina) ajustes.push({ motivo: "Comparable tiene piscina y la propiedad captada no", monto: -4000 });
  if (subject.seguridad && !comp.seguridad) ajustes.push({ motivo: "Comparable no tiene seguridad 24/7", monto: 2000 });
  if (!subject.seguridad && comp.seguridad) ajustes.push({ motivo: "Comparable tiene seguridad 24/7 y la propiedad captada no", monto: -2000 });
  return ajustes;
}

function TogglePill({ label, checked, onClick }) {
  return (
    <button onClick={onClick} className={`rounded-full border-2 px-3 py-1.5 text-xs font-semibold transition ${checked ? "border-indigo-600 bg-indigo-50 text-indigo-700" : "border-gray-200 bg-white text-gray-500"}`}>

    </button>
  );
}

function AnalisisMercado({ open, onClose, captacion, onGuardar }) {
  const [comparables, setComparables] = useState([]);
  const [cargado, setCargado] = useState(false);

  if (open && !cargado) {
    setComparables((captacion.acm && captacion.acm.comparables) || []);
    setCargado(true);
  }
  if (!open) {
    if (cargado) setCargado(false);
    return null;
  }

  const c = captacion;
  const espacios = c.espacios || [];
  const espHab = espacios.find((e) => e.id === "habitaciones");
  const espBan = espacios.find((e) => e.id === "banos");
  const espEst = espacios.find((e) => e.id === "estacionamiento");
  const espAmen = espacios.find((e) => e.id === "amenidades");
  const subject = {
    habitaciones: espHab?.cantidad || 0,
    banos: espBan?.cantidad || 0,
    parqueos: espEst?.cantidad || 0,
    areaConstruccion: c.areaConstruccion || null,
    areaTerreno: areaTerrenoEnVaras2(c.areaTerreno, c.unidadTerreno || "varas2"), // normalizado a varas² para comparar contra comparables
    areaTerrenoDisplay: c.areaTerreno || null, // valor tal como lo capturó el asesor, en su unidad original
    unidadTerreno: c.unidadTerreno || "varas2",
    remodelada: !!c.remodelada,
    amueblada: !!c.amueblada,
    piscina: !!espAmen?.caracteristicas.some((x) => x.nombre === "Piscina"),
    seguridad: !!espAmen?.caracteristicas.some((x) => x.nombre === "Seguridad 24/7"),
  };

  const faltantes = [];
  if (!c.areaConstruccion) faltantes.push("área de construcción");
  if (!c.areaTerreno && c.tipoInmueble !== "apartamento") faltantes.push("área de terreno");
  if (c.antiguedad == null) faltantes.push("antigüedad");

  function agregarComparable() {
    setComparables((prev) => [...prev, { id: newId(), direccion: "", precio: "", areaTerreno: "", areaConstruccion: "", habitaciones: "", banos: "", parqueos: "", remodelada: false, amueblado: false, piscina: false, seguridad: false }]);
  }
  function actualizar(id, campo, valor) {
    setComparables((prev) => prev.map((cp) => (cp.id === id ? { ...cp, [campo]: valor } : cp)));
  }
  function eliminar(id) {
    setComparables((prev) => prev.filter((cp) => cp.id !== id));
  }

  const calculados = comparables
    .filter((cp) => Number(cp.precio) > 0)
    .map((cp) => {
      const compN = { ...cp, habitaciones: cp.habitaciones !== "" ? Number(cp.habitaciones) : null, banos: cp.banos !== "" ? Number(cp.banos) : null, parqueos: cp.parqueos !== "" ? Number(cp.parqueos) : null, areaTerreno: cp.areaTerreno !== "" ? Number(cp.areaTerreno) : null, areaConstruccion: cp.areaConstruccion !== "" ? Number(cp.areaConstruccion) : null, precio: Number(cp.precio) };
      const similitud = calcularSimilitud(subject, compN);
      const ajustes = calcularAjustes(subject, compN);
      const precioAjustado = compN.precio + ajustes.reduce((s, a) => s + a.monto, 0);
      return { ...cp, similitud, ajustes, precioAjustado };
    })
    .sort((a, b) => b.similitud - a.similitud);

  const promedio = calculados.length > 0 ? calculados.reduce((s, cp) => s + cp.precioAjustado, 0) / calculados.length : null;
  const ventaRapida = promedio ? Math.round((promedio * 0.95) / 500) * 500 : null;
  const recomendado = promedio ? Math.round(promedio / 500) * 500 : null;
  const aspiracional = promedio ? Math.round((promedio * 1.07) / 500) * 500 : null;

  function guardar() {
    onGuardar({ comparables });
    onClose();
  }

  return (
    <div className="fixed inset-0 z-[60] flex flex-col bg-white">
      <div className="flex shrink-0 items-center justify-between border-b border-black/5 px-4 py-3">
        <button onClick={onClose} className="text-sm font-medium text-black/40">✕ Cerrar</button>
        <p className="text-xs font-bold uppercase tracking-wide text-indigo-700">Análisis Comparativo de Mercado</p>
      </div>

      <div className="flex-1 overflow-y-auto px-4 py-5">
        {/* Resumen de la propiedad captada */}
        <div className="mb-5 rounded-2xl bg-indigo-50 p-4">
          <p className="text-xs font-bold uppercase tracking-wide text-indigo-700">Propiedad captada</p>
          <p className="mt-1 text-base font-bold text-gray-900">{TIPO_INMUEBLE_LABEL[c.tipoInmueble]} · {c.zona || c.direccion}</p>
          <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-700">
            {subject.areaTerrenoDisplay && <span>{subject.areaTerrenoDisplay} {UNIDAD_TERRENO_LABEL[subject.unidadTerreno]} terreno</span>}
            {subject.areaConstruccion && <span>{subject.areaConstruccion} m² construcción</span>}
            <span>{subject.habitaciones} habitaciones</span>
            <span>{subject.banos} baños</span>
            {c.antiguedad != null && <span>{c.antiguedad} años</span>}
            {subject.parqueos > 0 && <span>{subject.parqueos} parqueos</span>}
            {subject.remodelada && <span>Remodelada</span>}
            {subject.amueblada && <span>Amueblada</span>}
          </div>
          <p className="mt-2 text-sm text-black/50">Precio actual de la captación: <span className="font-semibold text-gray-900">{formatMoney(c.precio)}</span></p>
        </div>

        {faltantes.length > 0 && (
          <div className="mb-5 rounded-xl border border-amber-200 bg-amber-50 p-3.5">
            <p className="text-sm text-amber-800">Para mejorar la precisión del ACM, falta confirmar: {faltantes.join(", ")}. Puedes completarlo editando la captación.</p>
          </div>
        )}

        {/* Comparables */}
        <h2 className="mb-3 text-base font-bold text-gray-900">Comparables</h2>
        <div className="mb-3 flex flex-col gap-3">
          {calculados.map((cp) => (

              <div className="mb-2 flex items-center gap-2">
                <input className="flex-1 rounded-xl border border-black/10 bg-gray-50 px-3 py-2.5 text-sm font-semibold outline-none focus:border-indigo-600"

                <button onClick={() => eliminar(cp.id)} className="shrink-0 rounded-full p-2 text-black/30 hover:bg-black/5">✕</button>
              </div>
              <Field label="Precio"><input type="number" className="mb-2 w-full rounded-xl border border-black/10 bg-gray-50 px-2.5 py-2 text-sm outline-none focus:border-indigo-600" value={cp.precio} onChange={(e) => actualizar(cp.id, "precio", e.target.value)} /></Field>
              <div className="mb-2 grid grid-cols-2 gap-2">
                <Field label="V² terreno"><input type="number" className="w-full rounded-xl border border-black/10 bg-gray-50 px-2.5 py-2 text-sm outline-none focus:border-indigo-600" value={cp.areaTerreno} onChange={(e) => actualizar(cp.id, "areaTerreno", e.target.value)} /></Field>
                <Field label="m² constr."><input type="number" className="w-full rounded-xl border border-black/10 bg-gray-50 px-2.5 py-2 text-sm outline-none focus:border-indigo-600" value={cp.areaConstruccion} onChange={(e) => actualizar(cp.id, "areaConstruccion", e.target.value)} /></Field>
              </div>
              <div className="mb-2 grid grid-cols-2 gap-2">
                <Field label="Habitaciones"><input type="number" className="w-full rounded-xl border border-black/10 bg-gray-50 px-2.5 py-2 text-sm outline-none focus:border-indigo-600" value={cp.habitaciones} onChange={(e) => actualizar(cp.id, "habitaciones", e.target.value)} /></Field>
                <Field label="Baños"><input type="number" className="w-full rounded-xl border border-black/10 bg-gray-50 px-2.5 py-2 text-sm outline-none focus:border-indigo-600" value={cp.banos} onChange={(e) => actualizar(cp.id, "banos", e.target.value)} /></Field>
              </div>
              <div className="mb-3 w-1/2 pr-1">
                <Field label="Parqueos"><input type="number" className="w-full rounded-xl border border-black/10 bg-gray-50 px-2.5 py-2 text-sm outline-none focus:border-indigo-600" value={cp.parqueos} onChange={(e) => actualizar(cp.id, "parqueos", e.target.value)} /></Field>
              </div>
              <div className="mb-3 flex flex-wrap gap-2">
                <TogglePill label="Remodelada" checked={cp.remodelada} onClick={() => actualizar(cp.id, "remodelada", !cp.remodelada)} />
                <TogglePill label="Amueblado" checked={cp.amueblado} onClick={() => actualizar(cp.id, "amueblado", !cp.amueblado)} />
                <TogglePill label="Piscina" checked={cp.piscina} onClick={() => actualizar(cp.id, "piscina", !cp.piscina)} />
                <TogglePill label="Seguridad 24/7" checked={cp.seguridad} onClick={() => actualizar(cp.id, "seguridad", !cp.seguridad)} />
              </div>

              <div className="rounded-xl bg-indigo-50 p-3">
                <div className="mb-1 flex items-center justify-between">
                  <Badge className={cp.similitud >= 85 ? "bg-emerald-100 text-emerald-700" : cp.similitud >= 70 ? "bg-amber-100 text-amber-700" : "bg-gray-200 text-gray-600"}>
                    {cp.similitud}% similar
                  </Badge>
                  <span className="text-sm font-bold text-indigo-900">Ajustado: {formatMoney(cp.precioAjustado)}</span>
                </div>
                {cp.ajustes.length > 0 && (
                  <details className="mt-1">
                    <summary className="cursor-pointer text-xs font-medium text-indigo-700">Ver ajustes sugeridos ({cp.ajustes.length})</summary>
                    <div className="mt-1.5 flex flex-col gap-1">
                      {cp.ajustes.map((a, i) => (
                        <div key={i} className="flex items-center justify-between text-xs text-indigo-900">

            </p>

      <div className="shrink-0 border-t border-black/5 bg-white p-4">
        <BotonGrande variant="primary" onClick={guardar} className="w-full">Guardar análisis</BotonGrande>
      </div>
    </div>
  );
}
